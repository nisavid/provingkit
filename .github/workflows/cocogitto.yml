name: Conventional commit compliance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: conventional-commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cog_check_job:
    runs-on: ubuntu-latest
    name: Conventional commit compliance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      - name: Conventional commit check
        shell: bash
        run: |
          root="$(git rev-list --first-parent --max-parents=0 HEAD)"
          # Cog's range can exclude its starting commit, including a tagged root.
          root_status=0
          cog check "$root..$root" || root_status=$?
          cog check "$root..HEAD"
          exit "$root_status"

  required:
    name: Conventional commits gate
    needs: [cog_check_job]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Check required job results
        if: ${{ always() }}
        shell: sh
        working-directory: .
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'Needed job results: %s\n' "$NEEDS_RESULTS"
          remaining=$NEEDS_RESULTS
          while :; do
            case "$remaining" in
              success) exit 0 ;;
              success,*) remaining=${remaining#*,} ;;
              *) exit 1 ;;
            esac
          done

name: Source skill disposition

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: source-skill-disposition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate disposition and refresh contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate source-skill disposition and Rolecasting
        run: |
          python -m unittest tests.test_validate_source_skill_disposition
          python scripts/validate_source_skill_disposition.py .
          python -m unittest tests.test_validate_rolecasting tests.test_rolecasting_eval_corpus
          python scripts/validate_rolecasting.py .

  required:
    name: Source skill disposition gate
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Check required job results
        if: ${{ always() }}
        shell: sh
        working-directory: .
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          printf 'Needed job results: %s\n' "$NEEDS_RESULTS"
          remaining=$NEEDS_RESULTS
          while :; do
            case "$remaining" in
              success) exit 0 ;;
              success,*) remaining=${remaining#*,} ;;
              *) exit 1 ;;
            esac
          done

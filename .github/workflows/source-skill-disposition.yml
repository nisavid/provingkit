name: Source skill disposition

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: source-skill-disposition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate disposition and refresh contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate source-skill disposition and Rolecasting
        run: |
          python -m unittest tests.test_validate_source_skill_disposition
          python scripts/validate_source_skill_disposition.py .
          python -m unittest tests.test_validate_rolecasting tests.test_rolecasting_eval_corpus
          python scripts/validate_rolecasting.py .

name: Versionkeeping native credential providers

on:
  push:
    branches: [nisavid/diagnose-windows-runtime-627]

concurrency:
  group: versionkeeping-native-credentials-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-credential-provider:
    name: ${{ matrix.os }} credential provider
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERSIONKEEPING_REQUIRE_NATIVE_CREDENTIAL_ROUNDTRIP: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Observe the first Windows runtime selection for issue 627
        id: observe
        shell: python
        run: |
          import hashlib
          import importlib
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          target = (
              "tests.plugins.versionkeeping.checkpointing-and-publishing-git-work."
              "test_git_publication_execution"
          )
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          module = importlib.import_module(target)
          adapter = module.adapter
          source = Path(adapter.__file__)
          source_bytes = source.read_bytes()
          canonical_source = source_bytes.replace(b"\r\n", b"\n")
          digest = hashlib.sha256(source_bytes).hexdigest()
          record = {
              "schema": "ci627:windows-runtime-site-observation-v2",
              "source_sha256": digest,
              "source_matches": b"\r" not in canonical_source and hashlib.sha256(canonical_source).hexdigest() == "32f601df9e3107a58de712e7095a8ce8252c53f1252a54b2eb0e236c1cb0ff10",
              "aggregate": "not_observed",
              "counts": {"registered": None, "machine": None, "eligible": None},
              "command_directory_failure": None,
              "events": [],
              "truncated": False,
              "observer_error": False,
          }
          counts = {
              "_windows_registered_git_roots": "registered",
              "_windows_machine_program_files_roots": "machine",
              "_windows_git_install_roots": "eligible",
          }
          sites = set(counts) | {
              "_trusted_git_runtime", "_trusted_windows_bundled_executable",
              "_windows_trusted_command_path", "_windows_paths_have_protected_acls",
              "_windows_acl_snapshot", "_windows_sid_string", "_require_windows_acl_trust",
          }
          state = {"seen": False, "active": False}

          def observe(frame, event, arg):
              try:
                  if frame.f_code.co_filename != str(source):
                      return None
                  name = frame.f_code.co_name
                  if name not in sites:
                      return None
                  if name == "_trusted_git_runtime" and event == "call":
                      if state["seen"]:
                          return None
                      state.update(seen=True, active=True)
                  if not state["active"]:
                      return None
                  if event == "return" and name in counts and type(arg) in (list, tuple):
                      record["counts"][counts[name]] = len(arg)
                  if event == "exception":
                      kind = "os_error" if isinstance(arg[1], OSError) else "other"
                      if name == "_windows_trusted_command_path" and frame.f_lineno == 634 and kind == "os_error":
                          directory = {
                              Path("cmd"): "cmd",
                              Path("mingw64/bin"): "mingw64_bin",
                              Path("usr/bin"): "usr_bin",
                          }.get(frame.f_locals.get("relative"), "unknown")
                          reason = "other_os_error"
                          if isinstance(arg[1], FileNotFoundError):
                              reason = "not_found"
                          elif isinstance(arg[1], PermissionError):
                              reason = "permission_denied"
                          record["command_directory_failure"] = {"directory": directory, "reason": reason}
                      if len(record["events"]) < 64:
                          record["events"].append({"site": name, "line": frame.f_lineno, "kind": kind})
                      else:
                          record["truncated"] = True
                      if name == "_trusted_git_runtime" and frame.f_lineno == 740:
                          record["aggregate"] = "runtime_unavailable"
                  if event == "return" and name == "_trusted_git_runtime":
                      if arg is not None:
                          record["aggregate"] = "runtime_returned"
                      state["active"] = False
                  return observe
              except Exception:
                  record["observer_error"] = True
                  state["active"] = False
                  return None

          previous = sys.gettrace()
          if record["source_matches"] and previous is None:
              try:
                  sys.settrace(observe)
              except Exception:
                  record["observer_error"] = True
          else:
              record["observer_error"] = True
          try:
              suite = unittest.defaultTestLoader.loadTestsFromName(
                  target + ".PublicationExecutionTests.test_system_windows_gcm_provider_is_trusted_and_executable"
              )
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          finally:
              try:
                  sys.settrace(previous)
                  data = (json.dumps(record, separators=(",", ":")) + "\n").encode("utf-8")
                  if len(data) > 11848:
                      raise ValueError("observation exceeds its byte limit")
                  directory = "ci627-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
                  output = Path(os.environ["RUNNER_TEMP"]) / directory / "runtime.json"
                  output.parent.mkdir()
                  with output.open("xb") as stream:
                      stream.write(data)
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                      stream.write("record_path=" + str(output) + "\n")
              except Exception:
                  pass
          raise SystemExit(0 if result.wasSuccessful() else 1)

      - name: Retain the closed observation for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci627-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.observe.outputs.record_path }}
          if-no-files-found: error
          retention-days: 1
